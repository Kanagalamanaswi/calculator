name: Deploy React App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: calculator-react/package-lock.json

      - name: Install dependencies
        working-directory: calculator-react
        run: npm ci

      - name: Build
        working-directory: calculator-react
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: calculator-react/dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4